name: Bootstrap generated project files

on:
  push:
    branches:
      - cg-001-bootstrap-vertical-slice
    paths:
      - package.json
      - .github/workflows/bootstrap-generated-files.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Format application files
        run: npm run format

      - name: Run quality gate
        run: npm run check

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android src tests package.json tsconfig.json vite.config.ts capacitor.config.ts eslint.config.js index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: generate lockfile and Android project"
          git push origin "HEAD:${GITHUB_REF_NAME}"
